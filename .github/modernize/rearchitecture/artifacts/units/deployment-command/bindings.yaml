unit: deployment-command
bindings:
  - type: convention
    name: "Hardhat run scripts/deploy.js --network localhost"
    source_loc: "package.json:10"
    target: "scripts/deploy.js"
    must_appear_in_target: true
    notes: "Requires the configured localhost JSON-RPC node to be running."
runtime_config:
  - key: "localhost.url / localhost.chainId"
    source_loc: "hardhat.config.js:8"
    source: code
    default_value: "http://127.0.0.1:8545 / 31337"
    must_appear_in_target: true
    notes: "The deploy command targets this Hardhat network alias."
