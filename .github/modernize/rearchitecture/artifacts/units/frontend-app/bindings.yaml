unit: frontend-app
bindings:
  - type: route-declaration
    name: "React root mount"
    source_loc: "frontend/src/main.jsx:6"
    target: "App"
    must_appear_in_target: true
    notes: "Single-page React app; vote and dashboard views are selected by component state, not URL routes."
  - type: listener
    name: "VoteCast contract event listener"
    source_loc: "frontend/src/App.jsx:36"
    target: "refresh candidate results after VoteCast"
    must_appear_in_target: true
    notes: "Listener is detached when the wallet-dependent effect is cleaned up."
runtime_config:
  - key: "deployment.address / deployment.abi"
    source_loc: "frontend/src/blockchain.js:2"
    source: code
    default_value: "Read from frontend/src/contract.json generated by scripts/deploy.js."
    must_appear_in_target: true
    notes: "Must correspond to the deployed contract on the selected chain."
  - key: "deployment.chainId"
    source_loc: "frontend/src/blockchain.js:4"
    source: code
    default_value: "31337"
    must_appear_in_target: true
    notes: "Used to switch/add the local Hardhat network in MetaMask."
